name: Rerun notebook

on:
  workflow_dispatch:
  push:
    branches: [Bhuvann13]
    paths:
      - tools/rerun.py
      - .github/workflows/rerun.yml

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy scikit-learn xgboost shap plotly lifelines matplotlib seaborn nbformat nbclient ipykernel joblib
      - run: python tools/rerun.py
      - name: Show errors
        run: cat run_errors.txt || true
      - name: Commit results
        run: |
          rm -f run_errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Precisoncology4 (3).ipynb" RESULTS.md xgb_best_model.json
          git commit -m "Rerun notebook without leaked features" || echo "nothing to commit"
          git push
